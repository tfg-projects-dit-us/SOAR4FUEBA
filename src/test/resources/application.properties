server.address=0.0.0.0
kogito.service.url=http://localhost:8080

# Seguridad: misma configuración que en main (este fichero sustituye por completo al de main)
kogito.security.auth.enabled=true
kogito.security.auth.impersonation.allowed-for-roles=admin
soar.security.users.analista.password={noop}analista
soar.security.users.analista.groups=soc
soar.security.users.admin.password={noop}admin
soar.security.users.admin.groups=soc,admin

# En los tests no hay broker Kafka: no se arrancan los consumidores
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=soar4fueba-test
spring.kafka.listener.auto-startup=false
