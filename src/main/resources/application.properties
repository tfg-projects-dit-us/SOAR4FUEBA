server.address=0.0.0.0

kogito.service.url=http://localhost:8080

# --- Seguridad (ver us.dit.ueba.soar.security.SeguridadConfig) ---
# Kogito toma el usuario y sus grupos de Spring Security. Sin esto (valor por defecto false) usaría los
# parámetros ?user=&group= de la URL, con los que cualquiera puede hacerse pasar por cualquiera
kogito.security.auth.enabled=true
# Grupos que sí pueden actuar en nombre de otro usuario con ?user=&group=
kogito.security.auth.impersonation.allowed-for-roles=admin
# Usuarios de PRUEBA (HTTP Basic), provisionales hasta conectar un proveedor de identidad real.
# password lleva el prefijo de su codificación: {noop}texto plano o {bcrypt}hash.
# groups son los grupos que se comparan con los GroupId de las tareas humanas del BPMN
soar.security.users.analista.password={noop}analista
soar.security.users.analista.groups=soc
soar.security.users.admin.password={noop}admin
soar.security.users.admin.groups=soc,admin

# --- Kafka (eventos de mensaje BPMN) ---
# Dirección del broker; se puede sobrescribir con la variable de entorno KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=soar4fueba
spring.kafka.consumer.auto-offset-reset=earliest
# Topics por defecto: kogito_incoming_stream (recepción) y kogito_outgoing_stream (envío).
# Para asignar un topic concreto a cada mensaje BPMN (<NombreMensaje> = nombre del mensaje en el proceso):
#   kogito.addon.cloudevents.kafka.kogito_incoming_stream.<NombreMensaje>=<topic>
#   kogito.addon.cloudevents.kafka.kogito_outgoing_stream.<NombreMensaje>=<topic>
kogito.addon.cloudevents.kafka.kogito_incoming_stream.detectionfinding=soar-alertas

# --- OCSF (Open Cybersecurity Schema Framework) ---
# Clases OCSF de interés. Se leen en dos momentos:
#  - En el build (src/codegen/ocsf-schemas.groovy): se descargan los esquemas que falten a
#    src/main/resources/ocsf/schema/classes y se generan los POJOs en el paquete us.dit.ueba.soar.ocsf
#  - Al arrancar (OcsfSchemaRegistry): se cargan para validar eventos; las que no se hayan
#    incluido en el build se descargan en segundo plano (solo validación, sin POJO)
# Ojo: el build necesita valores literales (sin ${...}).
# Categoría 2 (Findings); se omite security_finding (2001) porque está obsoleta.
ocsf.classes=vulnerability_finding,compliance_finding,detection_finding,incident_finding,data_security_finding,application_security_posture_finding,iam_analysis_finding
# Servidor del que se descargan los esquemas (sirve la versión por defecto que tenga publicada)
ocsf.schema.server-url=https://schema.ocsf.io
# El servidor público tarda alrededor de 1 minuto por clase
ocsf.schema.download-timeout=PT10M
